<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Votre export est prêt</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background-color: #2196F3;
            color: white;
            padding: 15px;
            border-radius: 5px 5px 0 0;
        }

        .content {
            padding: 20px;
            border: 1px solid #ddd;
            border-top: none;
            border-radius: 0 0 5px 5px;
        }

        .button {
            display: inline-block;
            padding: 12px 24px;
            margin: 20px 0;
            text-decoration: none;
            color: white;
            background-color: #2196F3;
            border-radius: 5px;
            font-weight: bold;
        }

        .note {
            font-size: 0.9em;
            color: #666;
            font-style: italic;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h2 style="margin:0;">Export validé</h2>
        </div>
        <div class="content">
            <p>Bonjour {{ user.first_name }},</p>
            <p>Votre demande d'export des données "Calendrier +1000" a été validée par un administrateur.</p>

            <div style="text-align: center;">
                <a href="{{ download_link }}" class="button">Télécharger le fichier Excel</a>
            </div>

            <p class="note">Ce lien est temporaire et expirera dans 24 heures.</p>
            <p>Cordialement,<br>L'équipe A.N.D.RE</p>
        </div>
    </div>
</body>

</html>
