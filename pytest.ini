[pytest]
# Configuration pytest pour outilspapv2

# Répertoire des tests
testpaths = tests

# Configuration pytest-asyncio
asyncio_default_fixture_loop_scope = function

# Pattern de découverte des tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Options par défaut
# -v: Verbose
# --strict-markers: Erreur si marker inconnu
# --tb=short: Traceback court
# --disable-warnings: Masquer les warnings
# -ra: Résumé de tous les tests
# --color=yes: Couleurs
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -ra
    --color=yes

# Markers personnalisés
markers =
    unit: Tests unitaires (rapides, sans IO)
    integration: Tests d'intégration (avec DB, API externes)
    slow: Tests lents (> 1s)
    pappers: Tests nécessitant l'API Pappers
    openai: Tests nécessitant l'API OpenAI

# Timeout par défaut (en secondes)
timeout = 30

# Coverage (si pytest-cov installé)
# --cov=app --cov-report=html --cov-report=term
